<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAmJ Development｜不動産開発プラットフォーム</title>
<meta name="description" content="開発用地の売買、介護・医療事業のM&A、開発シミュレーション・財務設計・見積まで。機能と案件をアプリのように一覧で開けるトップページ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--bone:#F5F2EC;--bone2:#ECE7DD;--ink:#1A1815;--stone:#8A7C68;--stone-d:#6E6354;--line:#E4DED3;--acc:#9b6339;
--fr:'Fraunces',Georgia,serif;--sj:'Noto Serif JP',serif;--nj:'Noto Sans JP',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--nj);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.head{position:sticky;top:0;z-index:20;background:rgba(245,242,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head-in{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-family:var(--fr);font-size:19px;letter-spacing:.02em}
.logo small{display:block;font:9px/1.4 'Inter',monospace;letter-spacing:.24em;color:var(--acc)}
.head-nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--acc);color:#7e4e2d;background:none;border-radius:20px;padding:6px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn.fill{background:var(--acc);color:#fff}
.wrap{max-width:1180px;margin:auto;padding:26px 20px 60px}
.lead h1{font-family:var(--sj);font-size:27px;margin:14px 0 6px;line-height:1.45}
.lead p{color:var(--stone-d);font-size:13.5px;margin:0 0 6px;max-width:760px}
.search{margin:18px 0 6px;display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;border:1px solid var(--line);background:#fff;border-radius:24px;padding:10px 16px;font-size:14px;font-family:var(--nj)}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--stone-d)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec-t{font-family:var(--sj);font-size:15px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.sec-t:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:9px;min-height:132px;transition:transform .12s ease,box-shadow .12s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,24,21,.09)}
.ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bone2);color:var(--acc)}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:13.5px;font-weight:600;line-height:1.5}
.tile span{font-size:11.5px;color:var(--stone-d);line-height:1.6}
.tag{align-self:flex-start;font:9px/1 'Inter',monospace;letter-spacing:.14em;border:1px solid var(--acc);color:#7e4e2d;padding:3px 7px;border-radius:9px}
.tile.lock .ic{background:#f3e7dd}
.foot{border-top:1px solid var(--line);background:var(--bone2);padding:26px 20px;color:var(--stone-d);font-size:12px}
.foot-in{max-width:1180px;margin:auto;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
.hide{display:none!important}
@media(max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}.lead h1{font-size:21px}.tile{min-height:120px;border-radius:16px}}
</style>
</head>
<body>
<header class="head"><div class="head-in">
<a class="logo" href="index.html">TAmJ Development<small>REAL ESTATE &amp; HEALTHCARE</small></a>
<nav class="head-nav">
<a class="btn" href="home-classic.html">サイト紹介</a>
<a class="btn" href="login.html">ログイン</a>
<a class="btn fill" href="register.html">会員登録</a>
</nav></div></header>

<main class="wrap">
<div class="lead">
<h1>機能と案件を、アプリのように開く</h1>
<p>開発用地の売買、介護・医療事業のM&amp;A・事業承継、開発シミュレーションから見積まで。必要なものをタイルから直接開けます。</p>
</div>

<div class="search">
<input id="q" type="text" placeholder="キーワードで絞り込み（例：案件、見積、介護、村上）">
<button class="chip on" data-f="all">すべて</button>
<button class="chip" data-f="case">案件</button>
<button class="chip" data-f="tool">ツール</button>
<button class="chip" data-f="svc">サービス</button>
<button class="chip" data-f="acct">会員・問合せ</button>
<button class="chip" data-f="grp">グループ</button>
</div>

<div class="sec-t">案件</div>
<div class="grid" id="g-case"></div>
<div class="sec-t">ツール・シミュレーション</div>
<div class="grid" id="g-tool"></div>
<div class="sec-t">サービス</div>
<div class="grid" id="g-svc"></div>
<div class="sec-t">会員・お問い合わせ</div>
<div class="grid" id="g-acct"></div>
<div class="sec-t">グループのサイト</div>
<div class="grid" id="g-grp"></div>
</main>

<footer class="foot"><div class="foot-in">
<div><b>タムジ株式会社</b><br>〒103-0004 東京都中央区東日本橋3-3-17 Re-Know東日本橋4B<br>info@tamjump.com</div>
<div>不動産開発プラットフォーム TAmJ Development<br><a href="home-classic.html">従来のトップページ</a>／<a href="pricing.html">料金</a>／<a href="contact/">お問い合わせ</a></div>
</div></footer>

<script>
var IC={
 building:'<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5l7-2 7 2v16M9 9h2M9 13h2M13 9h2M13 13h2M10 21v-4h4v4"/></svg>',
 map:'<svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
 calc:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 house:'<svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.5-7 9-7 9z"/></svg>',
 doc:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
 lock:'<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1-5a8 8 0 1 1 17-6z"/></svg>',
 user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
 tag:'<svg viewBox="0 0 24 24"><path d="M3 12 12 3h9v9l-9 9z"/><circle cx="16.5" cy="7.5" r="1.4"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'
};
var ITEMS=[
 {g:'case',t:'村上3街区 複合ヘルスケア開発',s:'千葉県八千代市・12,429㎡。介護2棟／GH／デイ／クリニック／商業。運営事業者募集',h:'listings/murakami/',i:'heart',tag:'PASSWORD',lock:1},
 {g:'case',t:'案件一覧',s:'売買・開発・M&Aの募集中案件',h:'listings/',i:'map'},
 {g:'case',t:'八間 プロジェクト',s:'開発用地・設計イメージ',h:'listings/hachiken/',i:'building'},
 {g:'case',t:'教育大エリア 案件',s:'開発用地・測量図',h:'listings/kyoikudai/',i:'building'},
 {g:'tool',t:'開発シミュレーション',s:'土地条件から事業収支・見積を試算',h:'members/estimate-development.html',i:'calc',tag:'MEMBER'},
 {g:'tool',t:'スキーム設計',s:'所有・賃貸・信託などの持ち方を比較',h:'members/scheme-structure.html',i:'chart',tag:'MEMBER'},
 {g:'tool',t:'マーケットデータ',s:'エリアの市場データ（MCI）',h:'lp-mci.html',i:'chart'},
 {g:'svc',t:'開発サービス',s:'企画・設計・施工・運営の一気通貫',h:'members/service-development.html',i:'building',tag:'MEMBER'},
 {g:'svc',t:'設備・什器',s:'介護・医療施設の設備調達',h:'members/service-equipment.html',i:'house',tag:'MEMBER'},
 {g:'svc',t:'サービス紹介',s:'TAmJ Developmentでできること',h:'service.html',i:'doc'},
 {g:'svc',t:'料金',s:'仲介手数料・各サービスの費用',h:'pricing.html',i:'tag'},
 {g:'acct',t:'会員トップ',s:'会員向け機能の入口',h:'members/index.html',i:'user',tag:'MEMBER'},
 {g:'acct',t:'アカウント',s:'登録情報の確認・変更',h:'members/account.html',i:'user',tag:'MEMBER'},
 {g:'acct',t:'ヒアリングシート',s:'土地・事業の条件を入力して相談',h:'hearing/',i:'doc'},
 {g:'acct',t:'お問い合わせ',s:'案件の相談・資料請求',h:'contact/',i:'chat'},
 {g:'acct',t:'ログイン',s:'会員の方はこちら',h:'login.html',i:'lock'},
 {g:'acct',t:'会員登録',s:'無料。シミュレーションが使えます',h:'register.html',i:'user'},
 {g:'grp',t:'Re-Bridge',s:'事業承継・M&Aプラットフォーム',h:'https://rebridge.tamjump.com/',i:'link',ext:1},
 {g:'grp',t:'タムジ株式会社',s:'コーポレートサイト',h:'https://tamjump.com/',i:'link',ext:1},
 {g:'grp',t:'WE ARE ALL ONE HEART',s:'参加型モザイクアート（Kickstarter）',h:'https://www.kickstarter.com/projects/tamj/we-are-all-one-heart-23-pieces-one-world?ref=4k7z69',i:'link',ext:1}
];
function render(){
 ['case','tool','svc','acct','grp'].forEach(function(g){document.getElementById('g-'+g).innerHTML='';});
 ITEMS.forEach(function(it){
  var a=document.createElement('a');
  a.className='tile'+(it.lock?' lock':'');a.href=it.h;if(it.ext){a.target='_blank';a.rel='noopener';}
  a.dataset.k=(it.t+' '+it.s+' '+it.g).toLowerCase();
  a.innerHTML='<div class="ic">'+IC[it.i]+'</div><b>'+it.t+'</b><span>'+it.s+'</span>'+(it.tag?'<em class="tag">'+it.tag+'</em>':'');
  document.getElementById('g-'+it.g).appendChild(a);});
}
render();
var f='all';
function apply(){
 var q=document.getElementById('q').value.trim().toLowerCase();
 document.querySelectorAll('.tile').forEach(function(t){
  var okF=(f==='all')||t.parentElement.id==='g-'+f;
  var okQ=!q||t.dataset.k.indexOf(q)>=0;
  t.classList.toggle('hide',!(okF&&okQ));});
 document.querySelectorAll('.sec-t').forEach(function(s){
  var g=s.nextElementSibling;s.classList.toggle('hide',g.querySelectorAll('.tile:not(.hide)').length===0);
  g.classList.toggle('hide',g.querySelectorAll('.tile:not(.hide)').length===0);});
}
document.getElementById('q').addEventListener('input',apply);
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){
 document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});c.classList.add('on');f=c.dataset.f;apply();};});
</script>
</body></html>
